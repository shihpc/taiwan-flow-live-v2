name: backtest-regen
# 週期性「完整重生比對」班（docs/line-cards-spec.md §8「仍待處理」第二條）。
#
# spec 原文（未結案項，逐字）：
#   「**完整重生比對無法進 CI**：`backtest/cache/` 不進 git，CI 無法重跑 `run_sorting.py`
#     比對報告是否與腳本同步。目前靠離線結構檢查涵蓋「結論行消失」這類回歸。若要完整涵蓋，
#     需在 Actions 排一支帶 `FINMIND_TOKEN` 的週期性 job（抓快取約 50 分鐘），**尚未建置**。」
#
# 本班要守的東西，和 backtest.yml 不同：
#   backtest.yml  = 離線、不吃 secret，只驗「報告的節還在、結論行還在」的結構。
#   backtest-regen = 帶 token 抓真快取、真的重跑 run_sorting.py，把重生出來的
#                    report_sorting.md 和 repo 裡已 commit 的那份逐字比對。
#   → 抓得到的是「腳本改了但報告沒重跑」「報告被手改過」這類 backtest.yml 驗不出的漂移。
#
# 不一致時的處置：**只報不改**。本班故意不 commit 重生結果——report_sorting.md 是圖卡規格
# 的唯一回測依據，讓排程自動覆蓋等於讓機器人偷改已定案的結論。差異印在 log，job 轉紅，
# 由 notify-failure 開 issue，人看過 diff 再決定是「重跑補 commit」還是「腳本改錯要回退」。
#
# 週期的選定理由（spec 未訂週期，此處自訂並記錄）：
#   fetch.py 的 START/END 是寫死的固定窗（2025-06-15 ~ 2026-07-01），資料不隨時間長大，
#   所以漂移只可能由「改腳本／改報告」造成，不是每天都會發生 → 不需要日班。
#   取每月一次（每月 1 日）＋ workflow_dispatch 手動補跑，成本（~50 分 job、約 550 次
#   FinMind 請求）與偵測延遲（最壞一個月）在這個用途上是划算的。改腳本後想立刻確認的人
#   走手動 dispatch，不必等排程。
#
# 時段選定理由：UTC 16:00 ＝ 台北（隔日）00:00。
#   避開台北 09:00–14:00 盤中（Worker frame 班每分鐘打 FinMind，本班 ~550 次請求會互相排擠）
#   與台北 17:00–23:55 晚場（哨兵＋evening 協調班）。要避開的下一組是晨班：
#   Worker us 主觸發 UTC 21:05（`worker/wrangler.toml` 第 9 條，台北 05:05）、
#   GH morning UTC 22:00、GH us 備援 UTC 22:10。
#
#   餘裕要用「延遲後」算，不能用準點算（2026-08-30 覆驗修正，原註解漏了這個前提）：
#   **GH cron 常態延遲是本家族有紀錄的事實**——本 repo `morning.yml` 檔頭自寫「cron 常延遲
#   ~70 分鐘」，`taiwan-stock-news/CLAUDE.md` 寫「常態延遲 1~2 小時」。原排的 UTC 18:00
#   若延遲 2 小時＋50 分執行，收在 UTC 21:40–22:00，**正好壓在 us 主觸發與 morning/us 之上**，
#   等於撞進本班本來想避開的 FinMind 爭用窗。
#   改 UTC 16:00 後：起跑點距最早晨班（UTC 21:05）有 5 小時；即使延遲 2 小時起跑，
#   ~50 分的 job 也在 UTC 18:50 結束，仍留 2 小時以上淨空。
#
# 注意（已知、非本班可解）：重抓是「用今天的 FinMind 回答同一段歷史」，FinMind 事後修訂
# 歷史資料時，重生報告會因**資料**而非**程式**而不同。判讀 diff 要先排除這一種。

on:
  schedule:
    - cron: '0 16 1 * *'   # 每月 1 日 16:00 UTC = 台北 2 日 00:00（餘裕理由見檔頭「時段選定理由」）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  # 專屬 group，不與任何既有班（aetf/baseline/cards/daysummary/intraday/lastweek/
  # meta/morning/us/pages/worker-deploy）同名；cancel-in-progress: false 沿用全 repo 慣例
  group: backtest-regen
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    # 抓快取 ~50 分（fetch.py 每日 2 次請求＋0.8 秒禮貌間隔，撞限速時另等 65 秒）
    # ＋ run_sorting.py 重算；120 分留給「首次全新抓取又撞到限速」的最壞情況。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # fetch.py 與 run_sorting.py 都只用標準庫（gzip/json/urllib），不需 pip install。

      # 快取鍵綁 fetch.py 的內容雜湊：抓取邏輯或 START/END 窗一改，鍵就變、強制重抓，
      # 不會拿舊格式的 price_*.json.gz 餵新程式。fetch.py 本身可中斷續傳（既有檔會跳過），
      # 所以 restore 命中時抓取步驟幾乎是零成本，只補缺漏日。
      #
      # 為什麼拆成 restore ＋ save，而不是用 actions/cache@v4（2026-08-30 覆驗必修）：
      #   actions/cache 的 `action.yml` 是 `post-if: "success()"`——**job 失敗就不存快取**。
      #   本班在偵測到報告漂移時故意 `exit 1`，於是「偵測到漂移」這個最需要重跑確認的情境，
      #   反而是唯一存不下快取的情境：漂移沒被修掉之前，每個月都要重花 ~50 分鐘重抓。
      #   改成 restore/save 後，save 掛 `if: always()`，抓到的快取無論比對結果都會落地。
      #   （官方也是這樣建議：同一份 action.yml 把 `save-always` 標為 deprecated，訊息逐字寫
      #     「A separate `actions/cache/restore` step should be used instead」。）
      #   （另一種寫法是「把比對結果暫存、最後一步才 fail」——不採用：那只救得了比對這一步，
      #     fetch/run_sorting 自己爆掉時照樣整包丟掉，而且會把失敗點推離真正出錯的步驟，
      #     log 判讀變難。restore/save 是對所有結束路徑都成立的解。）
      #
      # 鍵的語意（別讓快取永遠 miss）：
      #   primary key 帶 `github.run_id` → **每次都是新鍵、必定 miss**，這是刻意的：
      #   命中要靠下面的 restore-keys 前綴。這樣 save 那步永遠不會撞到「鍵已存在」而變成
      #   空操作，補抓到的缺漏日才寫得回去（否則第一次存進去的若是半殘快取，之後每一班
      #   都會 restore 到同一份半殘、補完、然後存不進去，永遠修不好）。
      #   restore-keys 只給到 `...-<fetch.py 雜湊>-` 為止，命中同雜湊中最新的一份；
      #   hashFiles 回定長 hex，前綴不可能跨雜湊誤命中，fetch.py 一改仍是強制重抓。
      - name: 還原回測快取
        uses: actions/cache/restore@v4
        with:
          path: backtest/cache
          key: backtest-cache-${{ hashFiles('backtest/fetch.py') }}-${{ github.run_id }}
          restore-keys: |
            backtest-cache-${{ hashFiles('backtest/fetch.py') }}-

      - name: 抓快取（FinMind）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python backtest/fetch.py

      - name: 重跑 run_sorting.py
        run: python backtest/run_sorting.py

      - name: 比對重生報告與已 commit 版本
        run: |
          if git diff --quiet -- backtest/report_sorting.md; then
            echo "OK: 重生的 report_sorting.md 與 repo 內容逐字相同"
            exit 0
          fi
          echo "::error::report_sorting.md 重生後與已 commit 版本不一致（腳本與報告不同步，或報告被手改）"
          echo "----- diff（已 commit ← 重生）-----"
          git --no-pager diff -- backtest/report_sorting.md
          echo "-----------------------------------"
          echo "判讀順序：①先確認不是 FinMind 事後修訂歷史造成的資料差異；"
          echo "②若是腳本變更造成 → 本機重跑 run_sorting.py 後 commit 新報告；"
          echo "③若是報告被手改 → 以腳本產出為準還原。本班不自動 commit。"
          exit 1

      # 存快取：`if: always()` ＝ 比對失敗（exit 1）、腳本爆掉、job 被取消時都照存。
      # 這一步本身不該把 job 弄紅（快取存不進去不影響本班結論），故 continue-on-error。
      - name: 保存回測快取
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: backtest/cache
          key: backtest-cache-${{ hashFiles('backtest/fetch.py') }}-${{ github.run_id }}

      - name: Notify failure
        # cancelled 也要告警：跑一半被取消（GitHub 端異常或誤按）同樣代表該場沒產出，
        # 而 failure() 在 cancelled 時不成立（2026-07-24 postmkt pm 場靜默消失的教訓）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          pipeline: v2-backtest-regen
