name: intraday
# 第七期 7a：盤中資料歸檔。KV frame TTL 僅 2 天，收盤後把「次產業 × 5分鐘時點」
# 累積成交額矩陣＋全日市場分鐘序列落到 data/intraday/YYYY-MM-DD.json，
# 給 8 月初的盤中訊號回測（7b）當原料。
# 排 14:10 台北（06:10 UTC）：13:30 收盤、13:33 最後一格 frame 之後留緩衝，
# frame 皆在當日 TTL 內。非交易日腳本自動優雅退出（無 frame → 不寫檔、不 commit）。
# KV 讀量：54 時點 × ≤6 get ＋ series 1 get ≈ ≤325 讀/日，遠低於免費 10 萬/日。
on:
  schedule:
    - cron: '10 6 * * 1-5'   # 週一~五 06:10 UTC = 14:10 台北
  workflow_dispatch:
    inputs:
      date:
        description: '歸檔日期 YYYY-MM-DD（留空＝台北今日；KV TTL 2 天，僅近兩日有料）'
        required: false
        default: ''

permissions:
  contents: write
  # data/intraday/ 本身是回測原料（raw 讀取）不需部署，但同一步產出的
  # data/rrg_base.json 是前端以同源相對路徑載入（比照 index.html 內 classify.json 的
  # fetch 慣例；行號會漂移故不引用，grep `data/classify.json` 可定位），
  # 沒 dispatch pages 就永遠停在舊版 → 需要 actions: write（2026-08-09 加）
  actions: write
  issues: write

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: archive intraday
        run: |
          d="${{ github.event.inputs.date }}"
          if [ -n "$d" ]; then
            python src/archive_intraday.py --date "$d"
          else
            python src/archive_intraday.py
          fi
      # RRG 盤外定格（G1，2026-09-11；規格 docs/rrg-spec-20260809.md §7）：把當日收盤那組
      # 軌跡的**輸入**（12 個時點的鏈層 share／amt ＋ rrg_base.json 的同時點切片）落成
      # data/rrg_frozen.json。前端在週末／假日／frame 過 KV 2 天 TTL 時改吃它畫圖並明標定格，
      # 不再整張圖消失。座標仍由前端算，本步不產生任何座標。
      #
      # ★ 位置固定在「build rrg base」**之前**，兩步不可調換：下一步會把「今天」也算進基準，
      #   重算後的 base 反推今天的座標就與使用者當日盤中看到的不一樣了——定格的意義正是
      #   「同一張圖」，切片必須取自使用者當日載到的那一版 rrg_base.json。
      # ★ 同樣「絕不」讓自己的失敗擋到下面的 commit（理由同下一步）：失敗只記 outputs.ok，
      #   紅燈延到 commit 之後才發。**不用 continue-on-error**（會被靜默吞掉，見最後一步註解）。
      # ★ 刻意不看 data/intraday/ 有沒有新檔就直接跑：本步只讀 KV frame，與歸檔無關；
      #   非交易日時腳本自己會因為「一格 frame 都沒有」優雅退出不寫檔（12 次 KV get，可忽略），
      #   這樣 workflow_dispatch 補跑舊日期也不會被「歸檔無變動」誤擋。
      # ★ **上面那條步驟序只在單次執行內成立**（2026-09-11 覆驗抓到）：同一天第二次跑時
      #   「build rrg base」會因 data/intraday/ 無新檔而跳過、本步卻照跑，磁碟上的 rrg_base.json
      #   已是第一次跑重算後、含當日的那版。所以**真正的守門在 Python 端**：
      #   build_rrg_frozen.py 遇到 `date in base["days"]` 一律拒絕寫檔（優雅退出保留舊檔）。
      #   改這兩步的順序或增刪守門前，先看該檔 build() 內那段註解。
      - name: build rrg frozen
        id: frz
        run: |
          d="${{ github.event.inputs.date }}"
          run_frozen() {
            if [ -n "$1" ]; then
              python src/build_rrg_frozen.py --date "$1"
            else
              python src/build_rrg_frozen.py
            fi
          }
          if false && run_frozen "$d"; then   # B2 演練：強制失敗（此分支專用，不進 main）
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            echo "::warning::build_rrg_frozen.py 失敗（exit $rc）→ 保留舊 data/rrg_frozen.json"\
                 "（前端盤外定格會停在前一版，該版自帶 date、畫面照實標示），"\
                 "不影響 data/intraday 歸檔；本次 run 會在 commit 之後才轉紅燈"
            git checkout -- data/rrg_frozen.json 2>/dev/null || true
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
      # RRG 同時點基準表：吃剛歸檔的 data/intraday/ 近 5 個有效交易日 ＋ data/baseline.json，
      # 離線免 token。非交易日（archive 優雅退出、沒新檔）就不跑，免得每天靠 generated_at
      # 製造無意義 commit 與 pages 部署。
      #
      # ★ 這一步「絕不」讓自己的失敗擋到下面的 commit：data/intraday/ 是回測原料、
      #   KV frame TTL 只有 2 天，一旦當天沒 commit 就永久遺失；而 rrg_base.json 只是
      #   附屬品，明天再產一份即可。故失敗只記在 outputs.ok，紅燈延到 commit 之後才發
      #   （見最後一步），達成「資料一定進 git ＋ 失敗仍看得見」兩者兼顧。
      #   builder 的三條 exit 1（缺 baseline/classify、有效交易日 <3、times 不一致）
      #   都在寫檔前 return，不會留下半殘檔；仍保險地 checkout 還原，杜絕半寫入被 commit。
      - name: build rrg base
        id: rrg
        run: |
          if [ -z "$(git status --porcelain data/intraday/)" ]; then
            echo "data/intraday/ 無新檔（非交易日或優雅退出）→ 跳過 rrg base"
            echo "ok=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python src/build_rrg_base.py; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            echo "::warning::build_rrg_base.py 失敗（exit $rc）→ 保留舊 rrg_base.json，"\
                 "不影響 data/intraday 歸檔；本次 run 會在 commit 之後才轉紅燈"
            git checkout -- data/rrg_base.json 2>/dev/null || true
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 優雅退出（非交易日/無 frame）時 data/intraday/ 可能不存在，git add 會報
          # pathspec 錯（2026-07-18 首跑踩到）——先擋
          if [ ! -d data/intraday ]; then echo "no data/intraday（優雅退出）"; exit 0; fi
          git add data/intraday/
          if [ -f data/rrg_base.json ]; then git add data/rrg_base.json; fi
          if [ -f data/rrg_frozen.json ]; then git add data/rrg_frozen.json; fi
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          # noop 守門（2026-09-06）：GH 兜底 cron 延遲後冪等重跑，內容全同、只有頂層 generated_at
          # 被覆寫也會有 diff → 多餘 commit＋時間戳失真。只有時間戳變動就放棄本次 commit
          # （exit 3）；守門自身出錯 fail-open 回 0 照常 commit。詳見 tools/noop_guard.py 檔頭。
          rc=0; python tools/noop_guard.py || rc=$?
          if [ "$rc" = "3" ]; then echo "只有時間戳變動（noop）→ 略過 commit"; git reset -q; exit 0
          elif [ "$rc" != "0" ]; then exit "$rc"; fi
          git commit -m "intraday archive $(date -u +%FT%TZ)"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            sleep 4
          done
          if [ "$pushed" != "1" ]; then echo "::error::push failed after 5 retries"; exit 1; fi
          # GITHUB_TOKEN 的 push 不會觸發 pages.yml（GitHub 防遞迴），需主動 dispatch，
          # 否則 data/rrg_base.json 進了 repo 卻不會出現在 Pages 站上（同 baseline.yml:46）
          # （grep 用 if 包住：GitHub Actions 的 bash 帶 -e，裸 `a && b` 失敗會直接讓步驟紅燈）
          # rrg_frozen.json 同樣是前端以同源相對路徑載入的產物（盤外定格），變動時也要部署，
          # 否則線上拿不到新的一版定格檔（週末打開會停在更舊的那天）
          if git diff --name-only HEAD~1 HEAD | grep -qE '^data/rrg_(base|frozen)\.json$'; then
            gh workflow run pages.yml --ref main
          else
            echo "rrg_base.json／rrg_frozen.json 皆未變動 → 不 dispatch pages"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # 排在 commit 之後才紅燈：讓 rrg base 的失敗看得見（不被 continue-on-error 靜默吞掉），
      # 但此時 data/intraday/ 已經 commit + push 完成，不會被連坐弄丟。
      - name: rrg base／frozen 失敗才轉紅燈
        if: steps.rrg.outputs.ok == '0' || steps.frz.outputs.ok == '0'
        run: |
          if [ "${{ steps.rrg.outputs.ok }}" = "0" ]; then
            echo "::error::build_rrg_base.py 失敗，data/rrg_base.json 未更新"\
                 "（data/intraday/ 歸檔已完成並 push，未受影響）"
          fi
          if [ "${{ steps.frz.outputs.ok }}" = "0" ]; then
            echo "::error::build_rrg_frozen.py 失敗，data/rrg_frozen.json 未更新"\
                 "（前端盤外定格停在前一版；data/intraday/ 歸檔已完成並 push，未受影響）"
          fi
          exit 1
      - name: Notify failure
        # cancelled 也要告警：跑一半被取消（GitHub 端異常或誤按）同樣代表該場沒產出，
        # 而 failure() 在 cancelled 時不成立（2026-07-24 postmkt pm 場靜默消失的教訓）
        if: false   # B2 演練：不開 issue（此分支專用，不進 main）
        uses: ./.github/actions/notify-failure
        with:
          pipeline: v2-intraday
