name: daysummary
# 第八期：收盤總結落檔。收盤後拉 Worker /live（13:30 收盤定格）重算收盤總結卡
# 同口徑的全日總結 → data/daysummary/YYYY-MM-DD.json＋latest.json，
# 供 taiwan-stock-news 晨報「昨日資金流向」段跨 repo raw 讀取。
# 主觸發＝Worker 13:35 台北（2026-07-22 翻轉；/live 13:30 定格後即備）。本 cron 為
# 備援 14:35 台北，與 intraday 14:10/14:40 錯開。非交易日 /live 定格日期
# 不符 → 腳本優雅退出（不寫檔、不 commit）。保留近 30 個交易日檔。
on:
  schedule:
    - cron: '35 6 * * 1-5'   # 週一~五 06:35 UTC = 14:35 台北（備援；主觸發＝Worker 13:35 新鮮度檢查 dispatch，2026-07-22 翻轉）
  workflow_dispatch:
    inputs:
      date:
        description: '目標日期 YYYY-MM-DD（留空＝台北今日；/live 定格日期不符即優雅退出）'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  # 不 dispatch pages：daysummary 由 news 站走 raw.githubusercontent 讀，不需部署

concurrency:
  group: daysummary
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: build daysummary
        run: |
          d="${{ github.event.inputs.date }}"
          if [ -n "$d" ]; then
            python src/build_daysummary.py --date "$d"
          else
            python src/build_daysummary.py
          fi
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 優雅退出（非交易日）時 data/daysummary/ 可能不存在，先擋（同 intraday 教訓）
          if [ ! -d data/daysummary ]; then echo "no data/daysummary（優雅退出）"; exit 0; fi
          git add data/daysummary/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          # noop 守門（2026-09-06）：GH 兜底 cron 延遲後冪等重跑，內容全同、只有頂層 generated_at
          # 被覆寫也會有 diff → 多餘 commit＋時間戳失真。只有時間戳變動就放棄本次 commit
          # （exit 3）；守門自身出錯 fail-open 回 0 照常 commit。詳見 tools/noop_guard.py 檔頭。
          rc=0; python tools/noop_guard.py || rc=$?
          if [ "$rc" = "3" ]; then echo "只有時間戳變動（noop）→ 略過 commit"; git reset -q; exit 0
          elif [ "$rc" != "0" ]; then exit "$rc"; fi
          git commit -m "daysummary $(date -u +%FT%TZ)"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            sleep 4
          done
          if [ "$pushed" != "1" ]; then echo "::error::push failed after 5 retries"; exit 1; fi
      - name: Notify failure
        # cancelled 也要告警：跑一半被取消（GitHub 端異常或誤按）同樣代表該場沒產出，
        # 而 failure() 在 cancelled 時不成立（2026-07-24 postmkt pm 場靜默消失的教訓）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          pipeline: v2-daysummary
