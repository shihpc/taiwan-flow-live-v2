name: morning
# 台股晨報：美股(us.yml 05:40)之後、開盤前 06:00 台北 產 data/morning.json。
# 22:00 UTC 週日~四 = 06:00 台北 週一~五（cron 常延遲 ~70 分鐘，實際約 07:10）。
on:
  schedule:
    - cron: '0 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 提交後 dispatch pages 部署
  issues: write

concurrency:
  group: morning
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: build morning.json
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python src/build_morning.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/morning.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          # noop 守門（2026-09-06）：GH 兜底 cron 延遲後冪等重跑，內容全同、只有頂層 generated_at
          # 被覆寫也會有 diff → 多餘 commit＋時間戳失真。只有時間戳變動就放棄本次 commit
          # （exit 3）；守門自身出錯 fail-open 回 0 照常 commit。詳見 tools/noop_guard.py 檔頭。
          rc=0; python tools/noop_guard.py || rc=$?
          if [ "$rc" = "3" ]; then echo "只有時間戳變動（noop）→ 略過 commit"; git reset -q; exit 0
          elif [ "$rc" != "0" ]; then exit "$rc"; fi
          git commit -m "morning $(date -u +%FT%TZ)"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            sleep 4
          done
          if [ "$pushed" != "1" ]; then echo "::error::push failed after 5 retries"; exit 1; fi
          # GITHUB_TOKEN 的 push 不會觸發 pages.yml（GitHub 防遞迴），需主動 dispatch 才會部署到網站
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Notify failure
        # cancelled 也要告警：跑一半被取消（GitHub 端異常或誤按）同樣代表該場沒產出，
        # 而 failure() 在 cancelled 時不成立（2026-07-24 postmkt pm 場靜默消失的教訓）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          pipeline: v2-morning
