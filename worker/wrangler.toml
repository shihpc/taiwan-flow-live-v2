name = "taiwan-flow-v2"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 四個 cron 共用同一個 scheduled handler（依台北時間＋event.cron 分流，
# 見 src/index.js scheduledRole）：
# 1) 盤中每分鐘存「分鐘快照 frame」到 KV（資金湧入偵測的盤中序列）
#    01:00-05:59 UTC = 09:00-13:59 台北，週一~五；收盤後 frame 值不再變、冪等
#    ※ 此字串需與 src/index.js 的 FRAME_CRON 完全一致（scheduledRole 用它
#      區分 9:07-13:07 的 :07 分重疊：frame cron 醒來的照存 frame，不搶去 dispatch news）
# 2) FinMind 哨兵：09:00-14:55 UTC = 17:00-22:55 台北每 5 分，探測盤後資料落地
#    → workflow_dispatch 觸發 taiwan-flows / postmkt（雙觸發：兩 repo 的 cron 保留當備援）
#    （2026-07-14 由 19:00 提早到 17:00：官方最早訊號為法人 20:00，17-20 點多為空轉，
#      但 FinMind 偶有提早入庫，早盯當免費保險；成本每晚約多 100 個探測請求）
# 3) 新聞定點班：每天（含週末）UTC 22:07/23:07（前一日）與 00:07-14:07
#    = 台北 06:07-22:07 每小時 :07（共 17 個時點）
#    → workflow_dispatch 觸發 taiwan-stock-news build-news.yml（該 repo 保留
#    22:37 台北 GitHub cron 當備援兜底）。實際哪些時點 dispatch 由程式判斷
#    （台北 hour 6-22 且 minute==7 才觸發），cron 只負責喚醒
# 4) 晨報準點班（與 3 共用同一條 cron 的 :47 分）：台北平日 06:47
#    → workflow_dispatch 觸發本 repo morning.yml（GitHub cron 06:00 保留當備援，
#    夜盤 05:00 收盤後留 ~1.5 小時給 FinMind 入庫；晨報建置冪等、多跑無害）。
#    其他小時的 :47 喚醒一律 idle（見 scheduledRole）
# 5) Worker 主排程（2026-07-22 翻轉；前身為 07-20「排程備援」）：GH Actions cron 常態延遲
#    60-90 分，Worker 升格主觸發者——CF cron 排在「上游資料就緒的理想時點」檢查產物新鮮度、
#    未更新即 workflow_dispatch；GH cron 挪後降級為兜底備援（一條不刪＝CF 單點故障防線）。
#    單體班見 src/index.js BACKUP_CRONS；晚場協調班/am summary 窗見 DISPATCH_ROLES。
#    即使與哨兵 cron 同分觸發，兩者各帶自己的 event.cron、互不干擾（dispatchRoleForCron 最先攔截）。
[triggers]
# ※ Cron Triggers 為帳戶層級額度：Free 5 條／Paid 250 條（Cloudflare 官方文件）；本帳戶已升 Paid。
#   新聞(:07)與晨報(:47)仍共用第三條、程式內分流（沿用既有設計，不因升 Paid 而拆分）。
#   ★★ dow 欄用 Quartz 慣例：1-7 = 日一二三四五六，**不是** POSIX 的 0-6。
#      平日 = 「2-6」，寫成 1-5 會變成「週日~週四」：星期五整天不觸發、星期日反而全跑。
#      （2026-07-20 首發時 CF 回 400「invalid cron string: 30 21 * * 0-4」正是此故——當時誤讀為
#        「CF 拒收 dow 0」，遂把 1-5 當平日用，導致 07-24、07-31 兩個星期五全線靜默、
#        07-26 星期日寫出 276 格休市死資料。2026-07-31 修正，見 PROJECT_SUMMARY「週五靜默」段。）
#      凡 UTC 日跨台北日界的班仍一律 dow *、週末守門在程式內以台北 dow 判（JS getDay 慣例 0=日，與此無關）。
crons = [
  "* 1-5 * * 2-6",           # 1) 盤中每分鐘 frame（09:00-13:59 台北，週一~五）
  "*/5 9-14 * * 2-6",        # 2) FinMind 哨兵（17:00-22:55 台北每 5 分）
  "7,47 0-14,22-23 * * *",   # 3) 新聞定點班(:07) / 晨報準點班(:47)，程式內分流
  "35 5 * * 2-6",            # 4) daysummary 主觸發（台北 13:35；/live 13:30 定格後即備。GH 備援 14:35）
  "40 6 * * 2-6",            # 5) intraday 備援（台北 14:40；GH 主班 14:10 先跑先贏，缺當日檔才補發——KV frame TTL 2 天，漏發即永久掉回測樣本）
  "35 10 * * 2-6",           # 6) aetf 一段主觸發（台北 18:35；GH 備援 19:05。二段 21:45 併入晚場協調班 aetf2）
  "5 12 * * 2-6",            # 7) baseline 主觸發（台北 20:05；法人官方 20:00＋腳本自帶重試。GH 備援 21:15）
  "*/5 13-15 * * 2-6",       # 8) 晚場協調班（台北 21:00-23:55 每 5 分）：pm summary 事件驅動＋diag→mktbal 鏈＋aetf2
  "5 21 * * *",              # 9) us 主觸發（台北 05:05；dow * + 程式守門。GH 備援 06:10）
  "50,55 22 * * *",          # 10) am summary 起手（台北 06:50/06:55；dow * + 程式守門）
  "*/5 23 * * *",            # 11) am summary 主窗（台北 07:00-07:55；morning 常態 07:1x 落地）＋us 晨間補跑檢查（07:00 起，見 runUsCatchup）
  "*/10 0 * * *",            # 12) am summary 尾窗（台北 08:00-08:50；morning 遲到仍趕 09:00 前）＋us 晨間補跑檢查（實際尾輪 08:00；窗至 08:05，之後不觸發、不跟 08:10 渲染搶）
  # 13-17) recheck 班（2026-07-25）：單發班的「dispatch 成功 ≠ job 成功」補課。
  #   主觸發後 T+25~50 分再檢查一次產物；仍非今日 → 補發第 2 次並告警（bkGate，上限 2 次）。
  #   全部排在該班 GH 兜底 cron 之前。與哨兵 cron（*/5 9-14）同分醒的兩條各帶自己的
  #   event.cron，dispatchRoleForCron 先攔截，互不干擾（同既有設計）。
  "5 6 * * 2-6",             # 13) daysummary recheck（台北 14:05）
  "10 7 * * 2-6",            # 14) intraday recheck（台北 15:10）
  "0 11 * * 2-6",            # 15) aetf recheck（台北 19:00）
  "55 12 * * 2-6",           # 16) baseline recheck（台北 20:55；等腳本自帶 10 分×4 重試跑完才判）
  "35 21 * * *",             # 17) us recheck（台北 05:35；dow * + 程式守門）
  # 18-19) 健檢班（2026-07-25 P1）：不 dispatch、不補跑，只盤點當日該有的產物是否落地，
  #   缺件走 alertJob 告警（每日每 slot 至多一則）。補 recheck 管不到的洞：達重試上限、
  #   以及哨兵/事件驅動類管線（flows/postmkt/news/summary）本來就沒有 recheck。
  "50 15 * * 2-6",           # 18) 日終健檢（台北 23:50，晚場班窗尾聲、GH 兜底 cron 全過）
  "30 1 * * 2-6",            # 19) 晨間健檢（台北 09:30，morning/us/summary-am 窗口全過）
  # 20) 台指期 tick 量測班（2026-09-09）——**暫時性**，量到答案就回來收窄或整條移除。
  #   只抓 FinMind TaiwanFuturesTick(TX) 當日檔、寫一把獨立 KV key，不 dispatch、不接哨兵。
  #   要回答的三個未知：日盤收盤段（time∈[13:44,14:00)）最早幾點拿得到／夜盤段是否先落地／
  #   單日 payload 位元組數與 fetch+parse 耗時。**上午也必須有樣本**（否則第二個未知驗不到），
  #   所以窗從台北 09:00 起，132 次/交易日。
  #   與 frame（* 1-5）、35 5、5 6、40 6、10 7、35 10、0 11 等既有 cron 同分撞點：各帶自己的
  #   event.cron，dispatchRoleForCron 以 TICK_CRON 精確比對**先攔截**（不可落到 scheduledRole，
  #   否則 09:00-13:59 會被判成 frame 而重複寫格）。dow 同樣是 Quartz 慣例，2-6＝週一~五。
  "*/5 1-11 * * 2-6",        # 20) tick 量測班（台北 09:00-19:55 每 5 分；※ 需與 src/index.js 的 TICK_CRON 完全一致）
]

# Workers Logs（2026-07-25）：原本 console.log 不落地，事後根本查不到「這班 cron 到底有沒有被叫起來」
# ——2026-07-24 整天沒有任何 frame/series（KV 只剩 4 個 key）就是查不出根因的實例。開啟後可用
# `npx wrangler tail` 即時看，dashboard 亦保留近幾日 invocation 紀錄（含 scheduled 事件成敗）。
[observability]
enabled = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "FLOW_KV"
id = "71ed931c80b045fc80529c265e089f15"

# 靜態依賴（classify.json / lastweek.json）來源：預設讀 V2 repo 的 raw；
# repo 尚未 push 前可暫時指向 V1（classify 結構相同）：
#   https://raw.githubusercontent.com/shihpc/taiwan-flow-live/main/data
[vars]
DATA_BASE = "https://raw.githubusercontent.com/shihpc/taiwan-flow-live-v2/main/data"
LIVE_TTL = "15"   # /live 聚合結果快取秒數

# Secrets（不寫進檔）：
#   npx wrangler secret put FINMIND_TOKEN      # FinMind API token
#   npx wrangler secret put GH_DISPATCH_TOKEN  # GitHub PAT（fine-grained，Actions: Read and write）
#     涵蓋範圍（2026-08-09 更正）：taiwan-flows + postmkt + taiwan-stock-news **＋ 本 repo
#     taiwan-flow-live-v2**。本註解原本只列前三個，但 2026-07-20 起 dispatchMorning（morning.yml）、
#     runBackup（daysummary/aetf/baseline/us/intraday.yml）、runAetf2（aetf.yml）、
#     runCardsRender（cards.yml）都是 dispatch 本 repo，且 07-22 首日實測全班 conclusion success
#     （見 PROJECT_SUMMARY「Worker 升格全系統主排程」段）——本 repo 權限早已具備，只是註解沒跟上。
#     哨兵／新聞／各主觸發班用來 workflow_dispatch；未設時整段跳過、其餘功能不受影響
